LOGIN PAGE RIGHT





<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>e-AROGYATA — Login & Registration</title>
  <link rel="stylesheet" href="styleslogin.css">
</head>
<body>
  <div class="container">
    <input type="checkbox" id="check">
    <div class="login form">
      <header>e-AROGYATA Login</header>
      <form id="login-form">
        <input type="email" name="email" placeholder="Enter your email" required value="harsh@example.com">
        <input type="password" name="password" placeholder="Enter your password" required value="password123">
        <a href="#">Forgot password?</a>
        <input type="submit" class="button" value="Login to Portal">
      </form>
      <div class="signup">
        <span class="signup">New Patient?
         <label for="check">Signup here</label>
        </span>
      </div>
    </div>

    <div class="registration form">
      <header>Create Account</header>
      <form id="signup-form">
        <input type="text" id="reg-name" placeholder="Full Name" required>
        <input type="email" id="reg-email" placeholder="Email Address" required>
        <input type="password" id="reg-password" placeholder="Create Password" required>
        <input type="tel" id="reg-phone" placeholder="Phone Number">
        <input type="submit" class="button" value="Register Now">
      </form>
      <div class="signup">
        <span class="signup">Already registered?
         <label for="check">Login</label>
        </span>
      </div>
    </div>
  </div>

  <script src="api-client.js"></script>
  <script>
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      const phone = document.getElementById('reg-phone').value;

      try {
        const res = await eArogyataAPI.apiRequest('/auth/signup', 'POST', { name, email, password, phone, role: 'PATIENT' });
        localStorage.setItem('earogyata_token', res.token);
        localStorage.setItem('earogyata_user', JSON.stringify(res.user));
        eArogyataAPI.showToast('🎉 Account created! Redirecting to profile...', 'success');
        setTimeout(() => window.location.href = 'patientprofile.html', 1200);
      } catch (err) {
        eArogyataAPI.showToast('Registration Error: ' + err.message, 'error');
      }
    });
  </script>
</body>
</html>
